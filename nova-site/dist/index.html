<title>NOVA Automation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --ground:#F5F5F5; --surface:#FFFFFF; --surface-2:#ECEEF0; --line:#DDE0E3; --line-strong:#CCCCCC;
  --ink:#343E48; --ink-2:#56626D; --ink-3:#7A8590;
  --accent:#F87D34; --accent-ink:#FFFFFF; --accent-soft:#FEEBDD; --accent-line:#F8B98F;
  --link:#267FA0;
  --blue:#267FA0; --teal:#30B1B6; --green:#3AA970; --yellow:#FDBB40; --charcoal:#343E48;
  --warm:#B8620F; --warm-soft:#FFF3D6;
  --nav-bg:#343E48; --nav-ink:#E6EAEE; --nav-ink-2:#9AA5B0; --nav-active:#414C57; --nav-accent:#F87D34;
  --code-bg:#ECEEF0;
  --shadow:0 1px 2px rgba(52,62,72,.06),0 6px 20px -8px rgba(52,62,72,.16);
  --display:"Montserrat",ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  --body:"Open Sans",ui-sans-serif,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#1F262D; --surface:#2A333C; --surface-2:#343E48; --line:#414C57; --line-strong:#56626D;
    --ink:#F5F5F5; --ink-2:#C5CDD4; --ink-3:#94A0AB;
    --accent:#F87D34; --accent-ink:#1F262D; --accent-soft:#4A3324; --accent-line:#B8622E;
    --link:#5CC4C8;
    --blue:#3E9BBE; --teal:#30B1B6; --green:#3AA970; --yellow:#FDBB40; --charcoal:#343E48;
    --warm:#FDBB40; --warm-soft:#3E3320;
    --nav-bg:#151A1F; --nav-ink:#E6EAEE; --nav-ink-2:#8792A0; --nav-active:#262E36; --nav-accent:#F87D34;
    --code-bg:#161C22;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#1F262D; --surface:#2A333C; --surface-2:#343E48; --line:#414C57; --line-strong:#56626D;
  --ink:#F5F5F5; --ink-2:#C5CDD4; --ink-3:#94A0AB;
  --accent:#F87D34; --accent-ink:#1F262D; --accent-soft:#4A3324; --accent-line:#B8622E;
  --link:#5CC4C8;
  --blue:#3E9BBE; --teal:#30B1B6; --green:#3AA970; --yellow:#FDBB40; --charcoal:#343E48;
  --warm:#FDBB40; --warm-soft:#3E3320;
  --nav-bg:#151A1F; --nav-ink:#E6EAEE; --nav-ink-2:#8792A0; --nav-active:#262E36; --nav-accent:#F87D34;
  --code-bg:#161C22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:0}
h1{font-size:clamp(32px,4.2vw,48px);line-height:1.25;font-weight:700}
h2{font-size:clamp(24px,2.8vw,32px);line-height:1.375;font-weight:500}
h3{font-size:24px;line-height:1.333;font-weight:500}
h4{font-size:16px;font-weight:700;color:var(--ink)}
p{margin:0}
ul,ol{margin:0;padding-left:1.25em}
li{margin:.3em 0}
li::marker{color:var(--ink-3)}
code,pre,.mono{font-family:var(--mono);font-size:.92em}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:14px 16px;overflow-x:auto;white-space:pre-wrap;line-height:1.5;margin:0}
hr{border:0;border-top:1px solid var(--line);margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.lede{font-size:18px;color:var(--ink-2);max-width:64ch}
.muted{color:var(--ink-3)}
.small{font-size:14px}
.caption{font-size:12px;line-height:16px;font-style:italic;color:var(--ink-3)}

/* Shell */
.shell{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
.nav{background:var(--nav-bg);color:var(--nav-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;padding:22px 16px 28px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 8px}
.brand .lock{display:flex;align-items:center;gap:10px}
.logo{display:block;flex:none}
.hero-lock{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero-lock .word{font-family:var(--display);font-weight:800;font-size:clamp(40px,6vw,64px);letter-spacing:.02em;color:var(--ink);line-height:1}
.brand .t{font-family:var(--display);font-weight:800;font-size:22px;color:#fff;letter-spacing:.02em}
.brand .s{font-family:var(--display);font-weight:500;font-size:11px;color:var(--nav-ink-2);letter-spacing:.08em;text-transform:uppercase}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup .gl{font-family:var(--display);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--nav-ink-2);padding:10px 8px 6px}
.nav a{color:var(--nav-ink);text-decoration:none;display:flex;align-items:baseline;gap:8px;padding:7px 8px;border-radius:5px;font-size:14px;line-height:1.3}
.nav a:hover{background:var(--nav-active)}
.nav a.active{background:var(--nav-active);color:#fff;box-shadow:inset 3px 0 0 var(--nav-accent)}
.nav a .n{font-family:var(--display);font-weight:700;font-size:11px;color:var(--nav-ink-2);min-width:18px}
.nav a.active .n{color:var(--nav-accent)}
.nav details{margin:2px 0}
.nav summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:7px 8px;border-radius:5px;font-size:14px;color:var(--nav-ink);font-family:var(--display);font-weight:700}
.nav summary::-webkit-details-marker{display:none}
.nav summary:hover{background:var(--nav-active)}
.nav summary .n{font-family:var(--display);font-weight:700;font-size:11px;color:var(--nav-accent);min-width:18px}
.nav summary .cnt{margin-left:auto;font-size:11px;color:var(--nav-ink-2);font-weight:500}
.nav details a{padding-left:34px;font-size:13.5px}
.nav details a .n{min-width:16px}
.btn{appearance:none;font:inherit;font-family:var(--display);font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:6px;border:1px solid var(--charcoal);background:var(--charcoal);color:#fff;cursor:pointer}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:wait}
.dlcard{border-left:4px solid var(--accent)}
.nav .dl{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--nav-active)}
.nav .dl a{color:var(--nav-accent);font-family:var(--display);font-weight:700}
.main{min-width:0;padding-block:36px 80px;padding-inline:clamp(16px,5vw,64px)}
.page{max-width:900px;display:flex;flex-direction:column;gap:32px}
.mobilebar{display:none}

/* Blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.card.lift{box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.section{display:flex;flex-direction:column;gap:14px}
.section>h2{padding-bottom:10px;position:relative}
.section>h2::after{content:"";display:block;height:4px;margin-top:10px;background:linear-gradient(-70deg,var(--accent) 0 12%,transparent 12% 13.5%,var(--teal) 13.5% 19%,transparent 19% 20.5%,var(--charcoal) 20.5% 100%)}
:root[data-theme="dark"] .section>h2::after,:root:not([data-theme="light"]) .section>h2::after{--charcoal:#56626D}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .section>h2::after{--charcoal:#343E48}}
.slash{height:10px;background:linear-gradient(-70deg,var(--accent) 0 14%,transparent 14% 15.5%,var(--blue) 15.5% 22%,transparent 22% 23.5%,var(--line-strong) 23.5% 100%);border-radius:2px}
.callout{border-left:4px solid var(--teal);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--teal);padding:14px 18px;border-radius:0 6px 6px 0;color:var(--ink)}
.callout.warm{border-left-color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line);border-left-color:var(--accent)}
.callout .eyebrow{color:inherit;opacity:.75;margin-bottom:4px;display:block}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;align-items:baseline}
.kv dt{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.kv dd{margin:0}
.pill{display:inline-block;font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2);background:var(--surface)}
.pill.acc{border-color:var(--teal);background:var(--surface);color:var(--ink)}
.pill.warm{border-color:var(--warm);background:var(--warm-soft);color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--line-strong)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.tw table{min-width:560px}
.num{font-variant-numeric:tabular-nums}
.check{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.check li{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin:0}
.check li::before{content:"";width:14px;height:14px;border:1.5px solid var(--line-strong);border-radius:3px;margin-top:4px}
.qs{counter-reset:q;list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.qs li{counter-increment:q;display:grid;grid-template-columns:28px 1fr;gap:8px;margin:0;padding:6px 0;border-bottom:1px dashed var(--line)}
.qs li::before{content:counter(q,decimal-leading-zero);font-family:var(--display);font-weight:700;font-size:12px;color:var(--accent);padding-top:3px}
.sample{background:var(--surface);border:1px dashed var(--line-strong);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sample .eyebrow{color:var(--accent)}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.opt .oh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.opt .oh h4{color:var(--ink);font-size:16px}
.opt .best{font-size:14px;color:var(--ink-2)}
.opt ul{padding-left:1.1em}
.opt li{font-size:14.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-strong);position:sticky;top:env(safe-area-inset-top,0px);background:var(--ground);z-index:5;padding-top:6px}
.tabs button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 14px;font:inherit;font-weight:600;color:var(--ink-3);cursor:pointer;font-size:15px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.playhead{display:flex;flex-direction:column;gap:10px}
.playhead .meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--ink-2)}
.playhead .meta b{color:var(--ink);font-weight:600}
.subsec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:70px}
.subsec>h3{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.subsec>h3 .eyebrow{font-size:10.5px}
.pager{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px;flex-wrap:wrap}
.pager a{text-decoration:none;font-weight:600}
.dirfilter{display:flex;flex-wrap:wrap;gap:6px}
.dirfilter button{appearance:none;font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);cursor:pointer}
.dirfilter button[aria-pressed="true"]{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;white-space:nowrap}
.stat .l{font-size:13px;color:var(--ink-3)}
.timeline{display:grid;grid-template-columns:110px 1fr;gap:10px 16px}
.timeline .w{font-family:var(--display);font-weight:700;font-size:12px;color:var(--blue);padding-top:3px}
.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.toc a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.toc a:hover{border-color:var(--accent)}
.toc a .n{font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.toc a .t{font-family:var(--display);font-weight:700;font-size:17px}
.toc a .d{font-size:13.5px;color:var(--ink-2)}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .nav{display:none}
  .mobilebar{display:flex;gap:10px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--nav-bg);color:#fff;padding:12px 16px}
  .mobilebar .t{font-family:var(--display);font-weight:800;font-size:16px;flex:1;display:flex;align-items:center;gap:8px}
  .mobilebar select{font:inherit;font-size:14px;padding:6px 8px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);max-width:60%}
  .main{padding-block:24px 60px}
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv dt{margin-top:8px}
  .timeline{grid-template-columns:1fr}
  .tabs{overflow-x:auto}
}
.cmpbars{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.cmprow{display:grid;grid-template-columns:120px 1fr 200px;gap:12px;align-items:center;font-size:14px}
.cmprow .cl{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.cmprow .cv{text-align:right;white-space:nowrap}
.bar{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:3px}
.b-today{background:var(--line-strong)}
.b-nova{background:var(--teal)}
.subsec>h4{font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.subsec>h4 .eyebrow{font-size:10.5px}
@media (max-width:860px){.cmprow{grid-template-columns:1fr;gap:4px}.cmprow .cv{text-align:left}}
/* ---------- Public site ---------- */
body.is-public{background:var(--ground)}
#public{min-height:100vh;display:flex;flex-direction:column}
#public main{flex:1}
.pin{max-width:1120px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.pin.narrow{max-width:800px}
.ph{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.phin{max-width:1120px;margin:0 auto;padding:12px clamp(16px,4vw,40px);display:flex;align-items:center;gap:20px}
.plogo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;color:var(--ink);text-decoration:none}
.pnav{margin-left:auto;display:flex;align-items:center;gap:22px}
.pnav>a{color:var(--ink-2);text-decoration:none;font-weight:600;font-size:15px}
.pnav>a.on,.pnav>a:hover{color:var(--ink)}
.pbtn{display:inline-block;font-family:var(--display);font-weight:700;font-size:14px;padding:10px 16px;border-radius:6px;background:var(--accent);color:#fff!important;text-decoration:none!important;border:1px solid var(--accent);cursor:pointer;font:inherit;font-family:var(--display);font-weight:700}
.pbtn:hover{filter:brightness(.93)}
.pbtn.big{font-size:16px;padding:13px 22px}
.pbtn.ghost{background:transparent;color:var(--ink)!important;border-color:var(--line-strong)}
.pbtn.ghost:hover{border-color:var(--ink)}
.pdrop{position:relative}
.pdb{appearance:none;background:none;border:0;font:inherit;font-weight:600;font-size:15px;color:var(--ink-2);cursor:pointer;padding:0}
.pdm{display:none;position:absolute;top:130%;left:-8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:260px;padding:6px;flex-direction:column;z-index:30}
.pdrop:hover .pdm,.pdrop:focus-within .pdm{display:flex}
.pdm a{padding:9px 12px;border-radius:5px;color:var(--ink);text-decoration:none;font-size:14.5px}
.pdm a:hover{background:var(--surface-2)}
.pburger{display:none;appearance:none;background:none;border:1px solid var(--line-strong);border-radius:6px;font-size:18px;padding:4px 10px;margin-left:auto;color:var(--ink);cursor:pointer}
.hero{background:var(--surface);border-bottom:1px solid var(--line);padding-block:56px 32px}
.hero.small{padding-block:56px 48px}
.herogrid{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,4.6vw,54px);line-height:1.12;font-weight:800;margin:10px 0 16px}
.hero .lede{font-size:18px;max-width:60ch}
.heroart{width:100%;max-width:420px;justify-self:end;height:auto}
.tstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.tstrip div{display:flex;flex-direction:column;gap:2px}
.tstrip b{font-family:var(--display);font-weight:800;font-size:28px;color:var(--ink);letter-spacing:-.01em}
.tstrip span{font-size:13.5px;color:var(--ink-3)}
.psec{padding-block:64px}
.psec.alt{background:var(--surface);border-block:1px solid var(--line)}
.psec h2{font-size:clamp(26px,3vw,36px);font-weight:700;margin:8px 0 24px;max-width:26ch}
.psec .eyebrow{color:var(--accent)}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.acard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;text-decoration:none;color:var(--ink);border-top:4px solid var(--blue)}
.acard:nth-child(2){border-top-color:var(--teal)}.acard:nth-child(3){border-top-color:var(--accent)}.acard:nth-child(4){border-top-color:var(--green)}
.acard h3{font-size:20px;font-weight:700}
.acard p{color:var(--ink-2);font-size:15px}
.acard .alink{margin-top:auto;font-family:var(--display);font-weight:700;color:var(--accent);font-size:14px}
.acard:hover{box-shadow:var(--shadow)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.ccard{background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:6px}
.ccard .cn{font-family:var(--display);font-weight:800;font-size:30px;color:var(--teal)}
.ccard h3{font-size:18px;font-weight:700}
.ccard p{font-size:14.5px;color:var(--ink-2)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:8px}
.step .sn{font-family:var(--display);font-weight:800;font-size:13px;color:#fff;background:var(--charcoal);width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.step h3{font-size:18px;font-weight:700}
.step p{font-size:14.5px;color:var(--ink-2)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.tcard{padding:18px 20px;border-left:4px solid var(--teal);background:var(--ground);border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:6px}
.tcard:nth-child(even){border-left-color:var(--accent)}

const money = n => "$" + Math.round(n).toLocaleString("en-US");
const cmpTotals = id => {
  const c = COMPARE[id]; const today = c.today.reduce((a,r)=>a+r[1],0);
  const y1 = c.nova.reduce((a,r)=>a+r[1],0); const ongoing = c.nova.filter(r=>!r[3]).reduce((a,r)=>a+r[1],0);
  return {today, y1, ongoing, saveY1: today-y1, saveOn: today-ongoing};
};
function renderCompare(p){
  const c = COMPARE[p.id]; if(!c) return "";
  const t = cmpTotals(p.id); const max = Math.max(t.today, t.y1, t.ongoing);
  const bar = (v, cls) => `<div class="bar"><span class="${cls}" style="width:${Math.max(2,v/max*100)}%"></span></div>`;
  const row = (r) => `<tr><td>${r[0]}${r[3]?` <span class="pill" style="margin-left:6px">yr 1 only</span>`:""}</td><td class="num">${money(r[1])}</td><td class="small muted">${r[2]}</td></tr>`;
  const sv = (v) => `<b style="color:${v>=0?"var(--green)":"var(--accent)"}">${v>=0?"saves ":"costs "}${money(Math.abs(v))}</b>`;
  return `
  <div class="subsec" style="margin-top:8px">
    <h4>Cost comparison <span class="eyebrow">today vs. with NOVA · annual</span></h4>
    <p class="caption">Assumptions: ${c.basis}</p>
    <div class="cmpbars">
      <div class="cmprow"><span class="cl">Today</span>${bar(t.today,"b-today")}<span class="cv num">${money(t.today)}</span></div>
      <div class="cmprow"><span class="cl">NOVA · year 1</span>${bar(t.y1,"b-nova")}<span class="cv num">${money(t.y1)} <span class="small">(${sv(t.saveY1)})</span></span></div>
      <div class="cmprow"><span class="cl">NOVA · ongoing</span>${bar(t.ongoing,"b-nova")}<span class="cv num">${money(t.ongoing)} <span class="small">(${sv(t.saveOn)})</span></span></div>
    </div>
    <div class="grid2">
      <div class="tw"><table><thead><tr><th colspan="3">Today — people, tools, and what the problem leaks</th></tr></thead><tbody>${c.today.map(row).join("")}<tr><td><b>Total today</b></td><td class="num"><b>${money(t.today)}</b></td><td></td></tr></tbody></table></div>
      <div class="tw"><table><thead><tr><th colspan="3">With NOVA — fees, usage, and what remains</th></tr></thead><tbody>${c.nova.map(row).join("")}<tr><td><b>Total year 1</b></td><td class="num"><b>${money(t.y1)}</b></td><td class="small muted">then ${money(t.ongoing)}/yr</td></tr></tbody></table></div>
    </div>
    <p class="small"><b>Other ways they'd solve it today:</b> ${c.alts}</p>
    <div class="callout"><span class="eyebrow">Not counted above</span>${c.upside}</div>
  </div>`;
}

function domToMd(root){
  const inl = n => { if(n.nodeType===3) return n.nodeValue.replace(/\s+/g," ");
    if(n.nodeType!==1) return "";
    const t=n.tagName, inner=()=>Array.from(n.childNodes).map(inl).join("");
    if(t==="A"){const h=n.getAttribute("href")||"";const txt=inner().trim();return h.startsWith("#")?txt:`[${txt}](${h})`;}
    if(t==="B"||t==="STRONG") return `**${inner().trim()}**`;
    if(t==="I"||t==="EM") return `*${inner().trim()}*`;
    if(t==="BR") return "\n";
    if(t==="CODE") return "`"+inner()+"`";
    if(t==="SVG"||t==="BUTTON"||t==="STYLE"||t==="SCRIPT") return "";
    return inner(); };
  const out=[];
  const blk = n => { if(n.nodeType===3){const v=n.nodeValue.trim(); if(v) out.push(v); return;}
    if(n.nodeType!==1) return; const t=n.tagName.toUpperCase(); const cl=n.getAttribute("class")||"";
    if(/\b(tabs|pager|dirfilter|slash|cmpbars|bar|logo)\b/.test(cl)||t==="SVG"||t==="BUTTON"||t==="STYLE"||t==="SCRIPT") return;
    if(/^H[1-4]$/.test(t)){ out.push("\n"+"#".repeat(+t[1])+" "+inl(n).replace(/\s+/g," ").trim()+"\n"); return; }
    if(t==="P"||cl.includes("eyebrow")||cl.includes("word")||cl.includes("stat")){ const v=inl(n).replace(/\s+/g," ").trim(); if(v) out.push(v+"\n"); return; }
    if(t==="PRE"){ out.push("```\n"+n.textContent.trim()+"\n```\n"); return; }
    if(t==="UL"||t==="OL"){ Array.from(n.children).forEach((li,i)=>{ const sub=li.querySelector("ul,ol"); const own=Array.from(li.childNodes).filter(c=>!(c.nodeType===1&&/^(UL|OL)$/.test(c.tagName))).map(inl).join("").replace(/\s+/g," ").trim(); out.push((t==="OL"?`${i+1}. `:"- ")+own); if(sub){ const before=out.length; blk(sub); for(let k=before;k<out.length;k++) out[k]="  "+out[k]; } }); out.push(""); return; }
    if(t==="DL"){ Array.from(n.children).forEach(c=>{ if(c.tagName==="DT") out.push(`- **${inl(c).trim()}**: `); else if(c.tagName==="DD") out[out.length-1]+=inl(c).replace(/\s+/g," ").trim(); }); out.push(""); return; }
    if(t==="TABLE"){ const rows=Array.from(n.querySelectorAll("tr")).map(tr=>Array.from(tr.children).map(td=>inl(td).replace(/\s+/g," ").replace(/\|/g,"\\|").trim())); if(!rows.length) return; const w=Math.max(...rows.map(r=>r.length)); const pad=r=>{while(r.length<w) r.push(""); return r;}; const head=n.querySelector("thead")?pad(rows.shift()):pad(new Array(w).fill("")); out.push("| "+head.join(" | ")+" |"); out.push("|"+head.map(()=>"---").join("|")+"|"); rows.forEach(r=>out.push("| "+pad(r).join(" | ")+" |")); out.push(""); return; }
    Array.from(n.childNodes).forEach(blk); };
  blk(root);
  return out.join("\n").replace(/\n{3,}/g,"\n\n").trim()+"\n";
}

async function doDownload(kind, btn){

}

  <section class="psec alt"><div class="pin"><div class="eyebrow">What we do</div><h2>Four services, one standard.</h2>${pillarCards()}</div></section>
  
  <section class="psec"><div class="pin narrow"><div class="eyebrow">Experience</div><h2>Where the ${SITE.years} years went.</h2><ul class="pains check2">${["Operating and advising owner-led businesses in the trades, healthcare and professional services","Implementing and integrating the platforms our clients run on — field service, practice management, CRM, accounting","Building and managing AI voice, messaging and document automation in production, with the compliance work that goes with it","Turning messy processes into SOPs, dashboards and repeatable systems"].map(x=>`<li>${x}</li>`).join("")}</ul></div></section>
  ${ctaBlock()}</main>${pFooter()}`;
}
function pContact(){
  return `${pHeader("contact")}<main>
  <section class="hero small"><div class="pin narrow"><div class="eyebrow">Free consultation</div><h1>Let's talk about your business.</h1><p class="lede">Thirty minutes, on the phone or video, about what's slow and what's leaking. No pitch — if we can help, we'll say how and roughly what it takes; if we can't, we'll say that. We reply within one business day with two times.</p></div></section>

      <label>Your name<input id="c_name" required autocomplete="name"></label>
      <label>Business name<input id="c_biz" required autocomplete="organization"></label>
      <label>Email<input id="c_email" type="email" required autocomplete="email"></label>

      <button class="pbtn big" type="submit">Request my free consultation</button>

    </form>
    <div class="section" style="gap:16px">
      <div class="card"><h3>What happens next</h3><ol style="padding-left:1.2em">${["We reply within one business day with two times.","We talk for 30 minutes about your business — no slides.","You get an honest read: where AI can help, where it can't, and what it would take.","If it's worth going further, we propose an audit or a pilot with a gate. If not, we say so."].map(x=>`<li>${x}</li>`).join("")}</ol></div>
      <div class="card"><h3>Direct</h3><p><a href="${tel()}">${SITE.phone}</a><br><a href="mailto:${SITE.email}">${SITE.email}</a></p><p class="small muted">${SITE.city}</p></div>
    </div></div></div></section></main>${pFooter()}`;
}
function sendContact(e){
  e.preventDefault();
  const v=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  const body=`Name: ${v("c_name")}\nBusiness: ${v("c_biz")}\nEmail: ${v("c_email")}\nPhone: ${v("c_phone")}\nIndustry: ${v("c_ind")}\nInterested in: ${v("c_svc")}\nBest times: ${v("c_time")}\n\nWhat they'd like to talk about:\n${v("c_msg")}`;
  window.location.href=`mailto:${SITE.email}?subject=${encodeURIComponent("Free consultation — "+v("c_biz"))}&body=${encodeURIComponent(body)}`;
  const n=document.getElementById("c_note"); if(n) n.textContent="Your email client should open with the request pre-filled. If it didn't, email us at "+SITE.email+".";
  return false;
}

  "law-firms":()=>pAudience("law-firms"), "medical":()=>pAudience("medical"), "home-services":()=>pAudience("home-services"), "accounting-insurance":()=>pAudience("accounting-insurance"),
  "bi-consulting":()=>pPillar("bi-consulting"), "agent-hiring":()=>pPillar("agent-hiring"), "automation":()=>pPillar("automation"), "on-prem":()=>pPillar("on-prem"),
  "how-we-work":pHow, "find-opportunities":pDiscover, "about":pAbout, "contact":pContact,
};

var SITE_EMAIL="${SITE.email}";
function sendContact(e){e.preventDefault();var v=function(id){var el=document.getElementById(id);return el?el.value.trim():"";};var body="Name: "+v("c_name")+"\\nBusiness: "+v("c_biz")+"\\nEmail: "+v("c_email")+"\\nPhone: "+v("c_phone")+"\\nIndustry: "+v("c_ind")+"\\nInterested in: "+v("c_svc")+"\\nBest times: "+v("c_time")+"\\n\\nWhat they'd like to talk about:\\n"+v("c_msg");window.location.href="mailto:"+SITE_EMAIL+"?subject="+encodeURIComponent("Free consultation — "+v("c_biz"))+"&body="+encodeURIComponent(body);var n=document.getElementById("c_note");if(n)n.textContent="Your email client should open with the request pre-filled. If it didn't, email us at "+SITE_EMAIL+".";return false;}`;

/* ---------- Admin gate ---------- */
let AUTHED=false; try{ AUTHED = sessionStorage.getItem("nova_admin")==="1"; }catch(e){}
let PENDING = null;
async function sha256(str){ const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join(""); }
function setAuthed(v){ AUTHED=v; try{ if(v) sessionStorage.setItem("nova_admin","1"); else sessionStorage.removeItem("nova_admin"); }catch(e){} }
function pLogin(msg){
  return `${pHeader("login")}<main><section class="hero small"><div class="pin narrow"><div class="eyebrow">Team login</div><h1>Admin panel</h1><p class="lede">The playbook, pricing models, contract terms and delivery kits behind this site. For the NOVA team.</p></div></section>
  <section class="psec"><div class="pin narrow"><div class="card lift" style="max-width:480px">
    <h3>Sign in</h3>
    <p class="small">If you're signed in to claude.ai with edit access to this site, you're recognized automatically.</p>
    <button class="pbtn" id="loginClaude">Continue with claude.ai</button>
    <hr><p class="small muted">Or enter the team passcode.</p>
    <form onsubmit="return loginPass(event)"><label class="small">Passcode<input id="passcode" type="password" autocomplete="current-password" required></label><button class="pbtn" type="submit" style="margin-top:8px">Enter</button></form>
    <p class="small" id="loginmsg" style="color:var(--accent)">${msg||""}</p>
  </div></div></section></main>${pFooter()}`;
}
async function claudeUser(){ try{ return window.claude && window.claude.use ? await window.claude.use("user") : null; }catch(e){ return null; } }
async function loginClaude(){
  const m=document.getElementById("loginmsg"); if(m) m.textContent="Checking…";
  const u=await claudeUser();
  if(u && (u.canEdit() || u.isOwner())){ setAuthed(true); goAfterLogin(); return; }
  if(m) m.textContent = u ? "This claude.ai account doesn't have edit access to this site. Use the passcode or ask the owner." : "Not signed in to claude.ai in this view. Use the passcode.";
}
async function silentClaudeCheck(){ if(AUTHED) return; const u=await claudeUser(); if(u && (u.canEdit() || u.isOwner()) && !AUTHED){ setAuthed(true); goAfterLogin(); } }
async function loginPass(e){
  e.preventDefault(); const v=document.getElementById("passcode").value; const m=document.getElementById("loginmsg");
  if(await sha256(v)===SITE.adminPassHash){ setAuthed(true); goAfterLogin(); } else if(m) m.textContent="That passcode didn't match.";
  return false;
}
function goAfterLogin(){ const t=PENDING||"#home"; PENDING=null; if(location.hash===t) route(); else location.hash=t; }
function logout(){ setAuthed(false); location.hash="#/"; }
document.addEventListener("click", e=>{ if(e.target.closest("#loginClaude")) loginClaude(); if(e.target.closest("#logoutBtn")) logout(); });

/* ---------- Dispatcher ---------- */
function showPublic(html){
  document.getElementById("shell").hidden=true; document.getElementById("mobilebar").hidden=true;
  const pub=document.getElementById("public"); pub.hidden=false; pub.innerHTML=html; window.scrollTo({top:0});
  document.body.classList.add("is-public");
}
function showAdmin(){
  document.getElementById("public").hidden=true; document.getElementById("shell").hidden=false; document.getElementById("mobilebar").hidden=false;
  document.body.classList.remove("is-public");
}
function route(){
  const h = location.hash || "#/";
  if(h.startsWith("#/")){
    const path=h.slice(2).split("?")[0].replace(/\/$/,"");
    if(path==="login"){ if(AUTHED){ location.hash="#home"; return; } showPublic(pLogin()); silentClaudeCheck(); return; }
    if(path===""){ return showPublic(pHome()); }
    if(PUBLIC_PAGES[path]){ location.replace(path+".html"); return; }   // old hash links → real pages
    return showPublic(pHome());
  }
  if(!AUTHED){ PENDING=h; showPublic(pLogin()); silentClaudeCheck(); return; }
  showAdmin(); adminRoute();
}

buildNav();
window.addEventListener("hashchange", route);
route();
</script>
